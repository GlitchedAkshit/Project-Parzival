<!doctype html>
<html lang="en" data-effects="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Parzival</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/environment.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/conversation.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/views.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Holographic workspace (pure decoration) -->
  <div class="env" aria-hidden="true">
    <div class="env__layer env__aurora" data-depth="0.15"></div>
    <canvas class="env__layer env__stars" data-depth="0.5"></canvas>
    <div class="env__layer env__grid" data-depth="0.25"></div>
    <svg class="env__layer env__orbits" data-depth="0.35" viewBox="-600 -600 1200 1200" preserveAspectRatio="xMidYMid slice">
      <g class="env__orbit-spin">
        <ellipse rx="560" ry="190" transform="rotate(-18)"/>
        <ellipse rx="430" ry="150" transform="rotate(24)"/>
        <ellipse rx="700" ry="250" transform="rotate(8)" class="is-faint"/>
      </g>
    </svg>
    <div class="env__spot"></div>
    <div class="env__scan"></div>
    <div class="env__vignette"></div>
  </div>

  <a class="skip-link" href="#composer-input">Skip to command input</a>

  <div class="app" id="app" data-mode="assistant" data-visual="loading">
    <!-- A. Status bar -->
    <header class="statusbar glass glass--bar" role="banner">
      <div class="statusbar__brand">
        <span class="sigil" aria-hidden="true"><span class="sigil__core"></span></span>
        <div class="statusbar__ident">
          <span class="statusbar__name">PARZIVAL</span>
          <span class="statusbar__state" id="sys-state">INITIALIZING</span>
        </div>
      </div>
      <div class="statusbar__clock" aria-label="Current time">
        <time class="clock__time" id="clock-time">--:--</time>
        <span class="clock__date" id="clock-date"></span>
      </div>
      <ul class="statusbar__meters" id="meters" aria-label="System status"></ul>
    </header>

    <main class="main" id="main">
      <!-- D. Conversation -->
      <section class="panel conversation glass" aria-labelledby="conv-title" data-float="1">
        <header class="panel__header">
          <div>
            <h2 class="panel__title" id="conv-title">Conversation</h2>
            <p class="panel__subtitle" id="conv-subtitle">This session</p>
          </div>
          <div class="panel__actions">
            <button class="icon-btn" id="conv-clear" type="button" aria-label="Clear conversation log" data-tip="Clear log"></button>
          </div>
        </header>
        <ol class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation messages"></ol>
        <form class="composer" id="composer" autocomplete="off">
          <label class="visually-hidden" for="composer-input">Message Parzival</label>
          <input class="composer__input" id="composer-input" type="text" maxlength="2000"
                 placeholder="Ask Parzival or give a command…" enterkeyhint="send">
          <button class="composer__send" id="composer-send" type="submit" aria-label="Send" disabled></button>
        </form>
      </section>

      <!-- B + C. AI core and voice interface -->
      <section class="stage" id="stage" aria-label="Assistant core">
        <div class="core" id="core">
          <div class="core__glow" aria-hidden="true"></div>
          <canvas class="core__canvas" id="core-canvas" aria-hidden="true"></canvas>
          <div class="core__frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="core__label">
          <p class="core__state" id="core-state" role="status" aria-live="polite">INITIALIZING</p>
          <p class="core__sub" id="core-sub">Bringing systems online…</p>
        </div>

        <div class="voice" id="voice">
          <p class="voice__transcript" id="voice-transcript" aria-live="polite"></p>
          <div class="voice__controls">
            <canvas class="voice__wave" id="voice-wave" aria-hidden="true"></canvas>
            <button class="mic" id="mic-btn" type="button" data-state="loading" aria-label="Start listening" disabled>
              <span class="mic__halo" aria-hidden="true"></span>
              <span class="mic__ring" aria-hidden="true"></span>
              <span class="mic__icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="voice__meta">
            <button class="switch-pill" id="wake-toggle" type="button" role="switch" aria-checked="false" disabled>
              <span class="switch-pill__track" aria-hidden="true"><span class="switch-pill__thumb"></span></span>
              <span class="switch-pill__label">Wake word</span>
            </button>
            <span class="voice__hint" id="voice-hint"></span>
          </div>
        </div>
      </section>

      <!-- F. Context panels -->
      <aside class="panel context glass" id="context" aria-label="Context" data-float="2"></aside>

      <!-- Workspace sheet (Search, Apps, System, Tasks, Home, Settings) -->
      <section class="sheet glass glass--deep" id="sheet" role="region" aria-labelledby="sheet-title" hidden>
        <header class="sheet__header">
          <span class="sheet__icon" id="sheet-icon" aria-hidden="true"></span>
          <div class="sheet__titles">
            <h2 class="sheet__title" id="sheet-title"></h2>
            <p class="sheet__desc" id="sheet-desc"></p>
          </div>
          <button class="icon-btn sheet__close" id="sheet-close" type="button" aria-label="Close panel" data-tip="Close (Esc)"></button>
        </header>
        <div class="sheet__body" id="sheet-body"></div>
      </section>
    </main>

    <!-- E. Quick command dock -->
    <nav class="dock glass glass--dock" id="dock" aria-label="Quick commands"></nav>
  </div>

  <div class="link-banner" id="link-banner" role="alert" hidden>
    <span class="link-banner__pulse" aria-hidden="true"></span>
    <span id="link-banner-text">Connection to Parzival's core was lost — reconnecting…</span>
  </div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
</body>
</html>
